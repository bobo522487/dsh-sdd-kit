# DeepSeek Harness (DSH) bundle patch for dsh-sdd-kit v0.3.0
# 1. 挂载本插件的 2 个桥接技能（/sdd-setup、/sdd-update）；执行纪律由 Spec Kit 原生扩展钩子注入。
# 2. 直接从 ~/.dsh/upstream/superpowers/skills 挂载上游 obra/superpowers 技能（零分叉）。
# 3. 挂载轻量 Host 工具插件（sdd_upstream、sdd_bridge）。
- insert:
    - id: skill-filesystem-sdd-kit
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: sdd-kit
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-sdd-kit/package.json')), 'skills')
    - id: skill-filesystem-superpowers-upstream
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: superpowers-upstream
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'upstream', 'superpowers', 'skills')
    - id: dsh-sdd-kit
      name: dsh-sdd-kit
