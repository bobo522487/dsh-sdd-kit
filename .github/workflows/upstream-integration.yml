# Upgrading SUPERPOWERS_REF (I8): the pinned-mirror variant must track an
# immutable ref, never a branch. To move the pin, pick a published release tag
# from https://github.com/obra/superpowers/releases, run the matrix once on a
# pull request, and only then bump the literal below.
#
# `git clone --depth 1 --branch <ref>` only resolves refs, so a release tag
# (e.g. v7.0.2) is the supported form here. To pin a bare commit sha instead,
# replace the clone with `git init` + `git fetch --depth 1 origin <sha>` +
# `git checkout FETCH_HEAD`; the post-clone HEAD assertion below still applies.
name: upstream-integration

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  # T089: the matrix must also guard changes, not only the nightly clock. A
  # regression in the CLI, the packaged extension or this workflow itself is
  # caught on the pull request instead of the next morning.
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'spec-kit-extension/**'
      - 'overrides/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/upstream-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'spec-kit-extension/**'
      - 'overrides/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/upstream-integration.yml'

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upstream: [latest, pinned-spec-kit, pinned-mirror]
        host: [dsh, claude]
    env:
      UPSTREAM_VARIANT: ${{ matrix.upstream }}
      HOST_KEY: ${{ matrix.host }}
      SPEC_KIT_REF: ${{ matrix.upstream == 'pinned-spec-kit' && 'v1.4.4' || '' }}
      # I8: a branch name made `pinned-mirror` a lie — the job re-resolved main
      # on every run, so a broken upstream landed unannounced. v7.0.2 is the
      # release this kit was validated against (see the header for upgrades).
      SUPERPOWERS_REF: ${{ matrix.upstream == 'pinned-mirror' && 'v7.0.2' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v5
      - name: Install the CLI under test
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Install the pinned Spec Kit ref (pinned-spec-kit only)
        if: matrix.upstream == 'pinned-spec-kit'
        run: uv tool install specify-cli --force --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}"
      - name: Pin the discipline mirror (pinned-mirror only)
        if: matrix.upstream == 'pinned-mirror'
        run: |
          git clone --depth 1 --branch "${SUPERPOWERS_REF}" https://github.com/obra/superpowers.git "$RUNNER_TEMP/superpowers-pinned"
          # I8: assert the checkout really sits on the pinned ref. A tag that
          # moves, or a clone that silently fell back to a default branch, would
          # otherwise reach the CLI as a "pinned" mirror that is nothing of the
          # kind.
          test "$(git -C "$RUNNER_TEMP/superpowers-pinned" rev-parse HEAD)" = "$(git -C "$RUNNER_TEMP/superpowers-pinned" rev-parse "${SUPERPOWERS_REF}^{commit}")"
          # T089: cloning is not pinning. The mirror reaches the CLI through the
          # one env channel it documents (see src/core/candidates.mjs), and it is
          # exported so every later step — doctor included — resolves the same
          # checkout instead of whatever happens to sit in $HOME.
          echo "DSH_SDD_KIT_SUPERPOWERS_DIR=$RUNNER_TEMP/superpowers-pinned" >> "$GITHUB_ENV"
      - name: Install → init → extension → overrides → doctor smoke (REQ-40)
        run: |
          WORKDIR="$RUNNER_TEMP/sdd-${UPSTREAM_VARIANT}-${HOST_KEY}"
          mkdir -p "$WORKDIR"
          specify init "$WORKDIR" --integration "$HOST_KEY" --non-interactive --force --ignore-agent-tools
          # The doctor only proves something when the sample project actually
          # carries the extension under test: without it the repository and host
          # zones degrade to warnings and the smoke test proves nothing.
          (cd "$WORKDIR" && specify extension add --dev "$GITHUB_WORKSPACE/spec-kit-extension" --force)
          # `extension add` installs commands and hooks but never the managed
          # spec-template override, so TEMPLATE_MISSING would be permanent.
          # Install it through the product's own bridge, not with a bare cp.
          node "$GITHUB_WORKSPACE/bin/sdd-kit.mjs" bridge --action install_overrides --cwd "$WORKDIR" --json > "$WORKDIR/overrides.json"
          # I8: the CLI only sets a non-zero exit code for status === 'error', so
          # a bridge that reports ok:false still exits 0. Without this gate the
          # step would go green on an install that wrote nothing.
          cat > "$RUNNER_TEMP/verify-overrides.mjs" <<'NODE'
          import fs from 'node:fs';

          // The bridge reports per-artifact outcomes and an aggregate `ok`.
          // Trust neither the exit code (always 0 here) nor `ok` alone: an
          // install that touched no artifact is not a success either.
          const file = process.argv[2];
          let report;
          try {
            report = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error(`overrides gate: cannot read ${file}: ${error.message}`);
            process.exit(1);
          }

          const problems = [];
          if (report.action !== 'install_overrides') {
            problems.push(`action is ${JSON.stringify(report.action)}, expected "install_overrides"`);
          }
          if (report.ok !== true) {
            problems.push(`install_overrides reported ok=${JSON.stringify(report.ok)} — the overrides did not land`);
          }
          const artifacts = Array.isArray(report.artifacts) ? report.artifacts : [];
          if (artifacts.length === 0) {
            problems.push('install_overrides touched no artifact — an empty install is a failure, not a pass');
          }
          for (const entry of artifacts) {
            if (entry?.status === 'failed') {
              problems.push(`artifact ${entry.id ?? '(unnamed)'} failed — ${entry.reason ?? entry.nextAction ?? ''}`);
            }
          }

          if (problems.length > 0) {
            console.error(`overrides gate failed for ${file}:`);
            for (const problem of problems) console.error(`  - ${problem}`);
            process.exit(1);
          }
          console.log(`overrides gate passed: ${artifacts.length} artifact(s), ok=${report.ok}`);
          NODE
          node "$RUNNER_TEMP/verify-overrides.mjs" "$WORKDIR/overrides.json"
          (cd "$WORKDIR" && node "$GITHUB_WORKSPACE/bin/sdd-kit.mjs" doctor --json --host "$HOST_KEY" > doctor.json)
          cat > "$RUNNER_TEMP/verify-doctor.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          // Zone presence alone is not evidence: a doctor where every zone is
          // fail still emits all five keys. Assert the state of each zone and
          // of each diagnostic item, and treat skipped/not_executed as a
          // failure for the zones that must actually execute here.
          const ZONES = ['environment', 'host', 'repository', 'runtime', 'triggerDryRun'];
          const ALLOWED = ['pass', 'fail', 'skipped', 'not_executed'];
          const MUST_PASS = ['environment', 'host', 'repository', 'runtime'];
          // T090: a green zone can still be hollow. These codes are the ones
          // that prove the packaged extension really landed in the sample
          // project, so they must be present AND pass.
          const MUST_PASS_ITEMS = {
            host: ['EXTENSION_STATE'],
            repository: ['TEMPLATE_DRIFT', 'COMMAND_SKILLS'],
          };
          // T090: the warn variants mean the extension is half-installed; a
          // warn must never be absorbed by the zone aggregate.
          const FORBIDDEN_ITEMS = ['TEMPLATE_MISSING', 'TEMPLATE_PACKAGED_MISSING'];
          // I8: the pinned-mirror variant exports the clone it just checked out.
          // If the doctor resolved any other mirror — the runner's ~/.dsh copy,
          // say — the pin proved nothing, so the job must fail instead of
          // reporting a green environment zone.
          const pinnedMirror = process.env.DSH_SDD_KIT_SUPERPOWERS_DIR;

          const file = process.argv[2];
          let report;
          try {
            report = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error(`doctor gate: cannot read ${file}: ${error.message}`);
            process.exit(1);
          }

          const problems = [];
          for (const zone of ZONES) {
            const value = report[zone];
            if (!value || typeof value !== 'object') {
              problems.push(`missing zone ${zone}`);
              continue;
            }
            const status = value.status;
            if (!ALLOWED.includes(status)) {
              problems.push(`${zone}: unknown status ${JSON.stringify(status)} (expected one of ${ALLOWED.join('|')})`);
              continue;
            }
            if (MUST_PASS.includes(zone) && status !== 'pass') {
              problems.push(`${zone}: status ${status}, but ${zone} must pass (skipped and not_executed are failures)`);
            }
            const items = value.items ?? [];
            for (const item of items) {
              if (item?.status === 'fail') {
                problems.push(`${zone}: failing item ${item.code ?? '(unnamed)'} — ${item.message ?? ''}`);
              }
              if (FORBIDDEN_ITEMS.includes(item?.code)) {
                problems.push(`${zone}: item ${item.code} is a warning that must never appear here — ${item.message ?? ''}`);
              }
            }
            const byCode = new Map(items.map((item) => [item?.code, item]));
            for (const code of MUST_PASS_ITEMS[zone] ?? []) {
              const item = byCode.get(code);
              if (!item) {
                problems.push(`${zone}: required item ${code} is missing`);
              } else if (item.status !== 'pass') {
                problems.push(`${zone}: item ${code} is ${item.status}, but it must pass — ${item.message ?? ''}`);
              }
            }
          }

          if (pinnedMirror) {
            // Compare real paths: the doctor reports the mirror's realpath, and
            // $RUNNER_TEMP may itself sit behind a symlink on some runners.
            const canonical = (value) => {
              const resolved = path.resolve(value);
              try {
                return fs.realpathSync(resolved);
              } catch {
                return resolved;
              }
            };
            const expected = canonical(pinnedMirror);
            const mirror = (report.environment?.items ?? []).find((item) => item?.code === 'UPSTREAM_MIRROR');
            if (!mirror) {
              problems.push('environment: the pinned-mirror job ran but UPSTREAM_MIRROR is missing');
            } else {
              if (mirror.status !== 'pass') {
                problems.push(`environment: UPSTREAM_MIRROR is ${mirror.status}, but the pin must be readable`);
              }
              if (mirror.via !== 'env') {
                problems.push(`environment: UPSTREAM_MIRROR resolved via ${JSON.stringify(mirror.via)}, but the exported pin must win`);
              }
              const resolved = typeof mirror.path === 'string' ? canonical(mirror.path) : null;
              if (resolved !== expected) {
                problems.push(`environment: UPSTREAM_MIRROR is ${resolved ?? '(none)'}, expected the pinned clone at ${expected}`);
              }
            }
          }

          if (problems.length > 0) {
            console.error(`doctor gate failed for ${file}:`);
            for (const problem of problems) console.error(`  - ${problem}`);
            process.exit(1);
          }
          console.log(`doctor gate passed: ${ZONES.map((zone) => `${zone}=${report[zone].status}`).join(' ')}`);
          NODE
          node "$RUNNER_TEMP/verify-doctor.mjs" "$WORKDIR/doctor.json"
      - name: Verify the live upstream contract
        run: |
          # M6: the verifier lives in the checkout, not in the step's cwd. A
          # relative path silently resolves against whatever directory a later
          # step happens to inherit, and the failure reads like a broken contract.
          node "$GITHUB_WORKSPACE/scripts/verify-upstream.mjs" --json > "$RUNNER_TEMP/upstream-report.json"
          node -e "const r = require(process.argv[1]); if (r.status !== 'passed') { console.error('upstream contract: ' + r.status + ' (not_executed is a failure, never a pass)' + (r.reason ? ' — ' + r.reason : '')); process.exit(1); } if (r.versionDrift && r.versionDrift.needsAdjustment) { console.error('upstream contract: version bound drift — ' + JSON.stringify(r.versionDrift)); process.exit(1); }" "$RUNNER_TEMP/upstream-report.json"
