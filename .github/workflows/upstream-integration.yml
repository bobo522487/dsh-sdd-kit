name: upstream-integration

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upstream: [latest, pinned-spec-kit, pinned-mirror]
        host: [dsh, claude]
    env:
      UPSTREAM_VARIANT: ${{ matrix.upstream }}
      HOST_KEY: ${{ matrix.host }}
      SPEC_KIT_REF: ${{ matrix.upstream == 'pinned-spec-kit' && 'v1.4.4' || '' }}
      SUPERPOWERS_REF: ${{ matrix.upstream == 'pinned-mirror' && 'main' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v5
      - name: Install the CLI under test
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Install the pinned Spec Kit ref (pinned-spec-kit only)
        if: matrix.upstream == 'pinned-spec-kit'
        run: uv tool install specify-cli --force --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}"
      - name: Pin the discipline mirror (pinned-mirror only)
        if: matrix.upstream == 'pinned-mirror'
        run: git clone --depth 1 --branch "${SUPERPOWERS_REF}" https://github.com/obra/superpowers.git "$RUNNER_TEMP/superpowers-pinned"
      - name: Install → init → extension → doctor smoke (REQ-40)
        run: |
          WORKDIR="$RUNNER_TEMP/sdd-${UPSTREAM_VARIANT}-${HOST_KEY}"
          mkdir -p "$WORKDIR"
          specify init "$WORKDIR" --integration "$HOST_KEY" --non-interactive --force --ignore-agent-tools
          # The doctor only proves something when the sample project actually
          # carries the extension under test: without it the repository and host
          # zones degrade to warnings and the smoke test proves nothing.
          (cd "$WORKDIR" && specify extension add --dev "$GITHUB_WORKSPACE/spec-kit-extension" --force)
          (cd "$WORKDIR" && node "$GITHUB_WORKSPACE/bin/sdd-kit.mjs" doctor --json > doctor.json)
          cat > "$RUNNER_TEMP/verify-doctor.mjs" <<'NODE'
          import fs from 'node:fs';

          // Zone presence alone is not evidence: a doctor where every zone is
          // fail still emits all five keys. Assert the state of each zone and
          // of each diagnostic item, and treat skipped/not_executed as a
          // failure for the zones that must actually execute here.
          const ZONES = ['environment', 'host', 'repository', 'runtime', 'triggerDryRun'];
          const ALLOWED = ['pass', 'fail', 'skipped', 'not_executed'];
          const MUST_PASS = ['environment', 'host', 'repository', 'runtime'];

          const file = process.argv[2];
          let report;
          try {
            report = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error(`doctor gate: cannot read ${file}: ${error.message}`);
            process.exit(1);
          }

          const problems = [];
          for (const zone of ZONES) {
            const value = report[zone];
            if (!value || typeof value !== 'object') {
              problems.push(`missing zone ${zone}`);
              continue;
            }
            const status = value.status;
            if (!ALLOWED.includes(status)) {
              problems.push(`${zone}: unknown status ${JSON.stringify(status)} (expected one of ${ALLOWED.join('|')})`);
              continue;
            }
            if (MUST_PASS.includes(zone) && status !== 'pass') {
              problems.push(`${zone}: status ${status}, but ${zone} must pass (skipped and not_executed are failures)`);
            }
            for (const item of value.items ?? []) {
              if (item?.status === 'fail') {
                problems.push(`${zone}: failing item ${item.code ?? '(unnamed)'} — ${item.message ?? ''}`);
              }
            }
          }

          if (problems.length > 0) {
            console.error(`doctor gate failed for ${file}:`);
            for (const problem of problems) console.error(`  - ${problem}`);
            process.exit(1);
          }
          console.log(`doctor gate passed: ${ZONES.map((zone) => `${zone}=${report[zone].status}`).join(' ')}`);
          NODE
          node "$RUNNER_TEMP/verify-doctor.mjs" "$WORKDIR/doctor.json"
      - name: Verify the live upstream contract
        run: |
          node scripts/verify-upstream.mjs --json > /tmp/upstream-report.json
          node -e "const r = require('/tmp/upstream-report.json'); if (r.status !== 'passed') { console.error('upstream contract: ' + r.status + ' (not_executed is a failure, never a pass)' + (r.reason ? ' — ' + r.reason : '')); process.exit(1); }"
